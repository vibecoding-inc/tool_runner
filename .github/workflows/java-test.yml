name: Java Test Runner

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Repository to run against (format: owner/repo)'
        required: true
        type: string
        default: 'my-org/my-repo'
      resumeUrl:
        description: "Webhook URL"
        required: true
        type: string
        default: 'https://example.org'

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Owner
        id: parse_owner
        run: |
          REPO_INPUT="${{ inputs.target_repository }}"
          echo "owner=${REPO_INPUT%%/*}" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse_owner.outputs.owner }}

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Java Tests
        id: test
        working-directory: ./target-source
        run: |
          set +e
          echo "### Java Test Report for ${{ inputs.target_repository }}" > ../report.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> ../report.txt
          echo "" >> ../report.txt
          
          # Detect build system
          if [ -f "pom.xml" ]; then
            echo "#### Maven project detected" >> ../report.txt
            echo "" >> ../report.txt
            
            echo "##### Running Maven tests..." >> ../report.txt
            mvn clean test >> ../report.txt 2>&1
            EXIT_CODE=$?
            echo "" >> ../report.txt
            
            # Try to extract test summary
            if [ -d "target/surefire-reports" ]; then
              echo "##### Test Summary:" >> ../report.txt
              find target/surefire-reports -name "*.xml" -exec grep -h "testcase" {} \; | wc -l | xargs echo "Total test cases:" >> ../report.txt
              find target/surefire-reports -name "*.xml" -exec grep -h "failure\|error" {} \; | wc -l | xargs echo "Failed/Error test cases:" >> ../report.txt
              echo "" >> ../report.txt
            fi
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "#### Gradle project detected" >> ../report.txt
            echo "" >> ../report.txt
            
            echo "##### Running Gradle tests..." >> ../report.txt
            ./gradlew clean test >> ../report.txt 2>&1
            EXIT_CODE=$?
            echo "" >> ../report.txt
            
            # Try to extract test summary
            if [ -d "build/test-results" ]; then
              echo "##### Test Summary:" >> ../report.txt
              find build/test-results -name "*.xml" -exec grep -h "testcase" {} \; | wc -l | xargs echo "Total test cases:" >> ../report.txt
              find build/test-results -name "*.xml" -exec grep -h "failure\|error" {} \; | wc -l | xargs echo "Failed/Error test cases:" >> ../report.txt
              echo "" >> ../report.txt
            fi
          else
            echo "#### No Maven or Gradle build file detected" >> ../report.txt
            echo "Cannot run tests without a build configuration" >> ../report.txt
            echo "" >> ../report.txt
            EXIT_CODE=1
          fi
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ All tests passed successfully" >> ../report.txt
          else
            echo "❌ Some tests failed" >> ../report.txt
          fi
          
          exit $EXIT_CODE

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report-file
          path: report.txt
          retention-days: 1

  send-webhook:
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Report
        uses: actions/download-artifact@v4
        with:
          name: java-test-report-file
          
      - name: Send Summary to Webhook
        run: |
          if [ ! -f report.txt ]; then
            echo "Critical Error: No report file found." > report.txt
          fi

          JSON_PAYLOAD=$(jq -n --rawfile val report.txt '{summary: $val}')
          
          echo "Sending payload to ${{ inputs.resumeUrl }}..."
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "${{ inputs.resumeUrl }}"
