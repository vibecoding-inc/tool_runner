name: Python Test Runner

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Repository to run against (format: owner/repo)'
        required: true
        type: string
        default: 'my-org/my-repo'
      resumeUrl:
        description: "Webhook URL"
        required: true
        type: string
        default: 'https://example.org'

permissions: {}

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract Owner
        id: parse_owner
        run: |
          REPO_INPUT="${{ inputs.target_repository }}"
          echo "owner=${REPO_INPUT%%/*}" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse_owner.outputs.owner }}

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest and coverage
        run: |
          pip install pytest pytest-cov

      - name: Run Python Tests
        id: test
        working-directory: ./target-source
        run: |
          set +e
          echo "### Python Test Report for ${{ inputs.target_repository }}" > ../report.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> ../report.txt
          echo "" >> ../report.txt
          
          # Check if this is a Python project
          if [ ! -f "requirements.txt" ] && [ ! -f "setup.py" ] && [ ! -f "pyproject.toml" ] && [ ! -f "setup.cfg" ]; then
            # Check if there are any Python test files
            TEST_FILES=$(find . -name "test_*.py" -o -name "*_test.py" | wc -l)
            if [ "$TEST_FILES" -eq 0 ]; then
              echo "#### No Python test files found" >> ../report.txt
              echo "This does not appear to be a Python project with tests" >> ../report.txt
              exit 1
            fi
          fi
          
          echo "#### Python project detected" >> ../report.txt
          echo "" >> ../report.txt
          
          # Install dependencies if requirements.txt exists
          if [ -f "requirements.txt" ]; then
            echo "##### Installing dependencies..." >> ../report.txt
            pip install -r requirements.txt >> ../report.txt 2>&1
            echo "" >> ../report.txt
          fi
          
          # Install test dependencies if they exist
          if [ -f "requirements-dev.txt" ]; then
            echo "##### Installing dev dependencies..." >> ../report.txt
            pip install -r requirements-dev.txt >> ../report.txt 2>&1
            echo "" >> ../report.txt
          elif [ -f "test-requirements.txt" ]; then
            echo "##### Installing test dependencies..." >> ../report.txt
            pip install -r test-requirements.txt >> ../report.txt 2>&1
            echo "" >> ../report.txt
          fi
          
          # Run tests with pytest
          echo "##### Running pytest..." >> ../report.txt
          pytest -v --cov=. --cov-report=term-missing --cov-report=html >> ../report.txt 2>&1
          EXIT_CODE=$?
          echo "" >> ../report.txt
          
          # Generate coverage summary if coverage.py was used
          if [ -f ".coverage" ]; then
            echo "##### Coverage Summary:" >> ../report.txt
            coverage report >> ../report.txt 2>&1
            echo "" >> ../report.txt
          fi
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ All tests passed successfully" >> ../report.txt
          else
            echo "❌ Some tests failed" >> ../report.txt
          fi
          
          exit $EXIT_CODE

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report-file
          path: report.txt
          retention-days: 1

      - name: Send Summary to Webhook
        if: always()
        run: |
          if [ ! -f report.txt ]; then
            echo "Critical Error: No report file found." > report.txt
          fi

          JSON_PAYLOAD=$(jq -n --rawfile val report.txt '{summary: $val}')
          
          echo "Sending payload to ${{ inputs.resumeUrl }}..."
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "${{ inputs.resumeUrl }}"
