name: CI with GitHub App Auth

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Repository to run against (format: owner/repo)'
        required: true
        type: string
        default: 'my-org/my-repo'
      resumeUrl:
        description: "Webhook URL"
        required: true
        type: string
        default: 'https://example.org'

jobs:
  run-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Owner
        id: parse_owner
        run: |
          REPO_INPUT="${{ inputs.target_repository }}"
          echo "owner=${REPO_INPUT%%/*}" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse_owner.outputs.owner }}

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-source

      - name: Run Linter Logic
        id: linter
        working-directory: ./target-source
        # Wir schreiben in eine Datei (report.txt), um sie später hochzuladen.
        # "set +e" verhindert, dass das Skript sofort abbricht, wenn der Linter fehlschlägt,
        # damit wir den Status noch in die Datei schreiben können.
        run: |
          echo "### Linter Report for ${{ inputs.target_repository }}" > ../report.txt
          echo "Commit: $(git rev-parse --short HEAD)" >> ../report.txt
          echo "" >> ../report.txt
          
          # Hier würde der echte Linter laufen. 
          # Wir simulieren Output:
          echo "Cooler Linter Output" >> ../report.txt
          
          # Optional: Wenn der echte Linter Fehler wirft, hier abfangen, 
          # in report.txt schreiben und dann exit code setzen.
      
      # WICHTIG: Dieser Schritt muss laufen, auch wenn der Linter oben fehlschlägt.
      - name: Upload Report Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: linter-report-file
          path: report.txt
          retention-days: 1

      - name: Send Summary to Webhook
        if: always()
        run: |
          # Falls der erste Job komplett abgestürzt ist und kein File da ist:
          if [ ! -f report.txt ]; then
            echo "Critical Error: No report file found." > report.txt
          fi

          # jq liest report.txt sicher ein und escaped es für JSON
          JSON_PAYLOAD=$(jq -n --rawfile val report.txt '{summary: $val}')
          
          echo "Sending payload to ${{ inputs.resumeUrl }}..."
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "${{ inputs.resumeUrl }}"
