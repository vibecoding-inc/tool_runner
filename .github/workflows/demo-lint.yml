name: CI with GitHub App Auth

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: 'Repository to run against (format: owner/repo)'
        required: true
        type: string
        default: 'my-org/my-repo'
      resumeUrl:
        description: "Webhook URL"
        required: true
        type: string
        default: 'https://example.org'

jobs:
  run-linter:
    runs-on: ubuntu-latest

    steps:
      # 1. Parse Owner (Required if target repo is in a different org)
      - name: Extract Owner
        id: parse_owner
        run: |
          REPO_INPUT="${{ inputs.target_repository }}"
          echo "owner=${REPO_INPUT%%/*}" >> $GITHUB_OUTPUT

      # 2. Authenticate as a GitHub App
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse_owner.outputs.owner }}

      # 3. Checkout the TARGET repository
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-source

      # 4. Run Logic
      - name: Run Linter Logic
        working-directory: ./target-source
        run: |
          echo "Successfully checked out ${{ inputs.target_repository }}" >> $GITHUB_STEP_SUMMARY
          echo "Current commit: $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "Cooler Linter Output" >> $GITHUB_STEP_SUMMARY

      # 5. POST to Webhook
      - name: Send Summary to Webhook
        run: |
          # Use jq to safely serialize the file content to JSON
          # --rawfile reads the file content directly into the 'val' variable, handling escaping automatically
          JSON_PAYLOAD=$(jq -n --rawfile val $GITHUB_STEP_SUMMARY '{summary: $val}')
          
          echo "Sending payload to ${{ inputs.resumeUrl }}..."
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "${{ inputs.resumeUrl }}"
